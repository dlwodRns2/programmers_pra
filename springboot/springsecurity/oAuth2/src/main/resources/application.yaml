spring:
  config:
    import: optional:classpath:application-secret.yaml
  application:
    name: oAuth2
  datasource:
    url: jdbc:mysql://localhost:3306/java_basic?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: re00
  security:
    oauth2:
      client:
        #[registration] : "우리 서비스"가 제공자에 등록한 CLient 정보
        #SecurityConfig : client_id, client_secret
        #로그인 진입 /oauth2/authorization/kakao,
        #콜백 : /login/oauth2/code/kakao
        registration:
          kakao:
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            #OAuth2에는 토큰을 얻는 방식(grant type)이 여러가지가 존재.
            #   authorization_code(인가 코드), client_credentials(서버끼리, 사용자 없음),
            #   refresh_token(재발급), (폐기됨: implicit, password)
            #그 중 "어떤 방식으로 카카오와 대화할지"를 결정한다.
            #로그인/동의하는 소셜 로그인은 authorization_code 한 가지뿐이라 사실상 고정값이다.
            #이 선택에 따라 Spring이 밟는 단계 전체(인가페이지 -> code -> 토큰 교환)가 결정된다.
            authorization-grant-type: authorization_code
            #토큰 교환 때 "우리가 진짜 그 Client임"을 증명하려고 client_secret을 보내는데,
            #그걸 어디에 실어 보낼지가 privider마다 다르다.
            #   - client_secret_basic: Authorization: Basic base64(id:secret) 헤더
            #   - client_secret_post : POST 본문에 client_id=...&client_secret=... 로 포함
            # 카카오는 POST 본문 방식만 받는다. 이 설정을 빼면 Spring이 기본값(Basic 헤더)으로
            # 보내서 토큰 교환이 인증 실패로 끝난다 — 제공자별로 다른 대표적 지점
            client-authentication-method: client_secret_post
            client-name: kakao
            #동의 항목(카카오 콘솔)
            scope:
              - profile_nickname
              - account_email
        #[provider] 제공자의 엔드포인트 정보
        #구글, 깃허브 등 일부 유명 provider는 Spring이 미리 알고 이 부분이 필요 없지만,
        #카카오는 모르는 제공자라서 표준 흐름의 각 단계가 "어디"인지 직접 알려줘야한다.
        provider: #구글과 달리 카카오는 provider 정보를 설정 파일에 작성해야함
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize #인가 페이지
            token-uri: https://kauth.kakao.com/oauth/token #코드 -> 토큰 교환(access token으로 바꾸는 곳). 브라우저를 거치지 않고 "우리 서버 -> 카카오 서버"가 직접 통신
            user-info-uri: https://kapi.kakao.com/v2/user/me #사용자 정보 조회 : 이 응답이 kakaoUserInfo가 파싱하는 바로 그 맵(attributes)이 된다.
            #nameAttributeKey로 들어가 providerId 추출의 기준이 된다. -> user_info 응답에서 "이 사용자를 유일하게 식별하는 값"이 담긴 최상위 필드 이름
            user-name-attribute: id
jwt:
  issuer: test@naver.com
  secret_key: u4HZtfDJi2y8g0l4dTTE4eddwQCzUdHHY5iKKIhPC2LXKS/YyeIrx+oR+ioz3Rrz/JUJsN5kcidBNdzgqMoKTg==
  access_token_validity: 2h
  refresh_token_validity: 7d

